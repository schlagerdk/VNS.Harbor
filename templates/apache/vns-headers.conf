# Every site, also those made before it: the answers do not tell others what the server runs.
# Apache says only "Apache" in its Server header and on its own pages, and X-Powered-By is never sent on.
# It comes after Ubuntu's own security.conf, so these settings are the ones that count.
ServerTokens Prod
ServerSignature Off
<IfModule mod_headers.c>
	Header always unset X-Powered-By
	Header unset X-Powered-By
</IfModule>
