# The page a visitor sees while a site's service is starting, being published or stopped,
# instead of Apache's bare "Service Unavailable". It is the page Windows publishes as app_offline.htm:
# it checks every few seconds and reloads as soon as the site answers again.
# It is set for the whole server, so every site, also those made before it, has it.
<IfModule mod_alias.c>
	Alias /vns-offline/ /var/lib/vns/offline/
</IfModule>
<Directory /var/lib/vns/offline>
	Options None
	AllowOverride None
	Require all granted
	<IfModule mod_headers.c>
		Header always set Cache-Control "no-store"
	</IfModule>
</Directory>
# Never sent on to a site's service: the main server's ProxyPass rules come before a site's own
<IfModule mod_proxy.c>
	ProxyPass /vns-offline/ !
</IfModule>
# Only Apache's own 503, when the service does not answer: a 503 the site sends itself is passed on as it is
ErrorDocument 503 /vns-offline/app_offline.htm
