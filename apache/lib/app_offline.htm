<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- Without JavaScript the page reloads every 5 seconds; with it, a check does, so the counter keeps going -->
<noscript><meta http-equiv="refresh" content="5"></noscript>
<title>Opdaterer…</title>
<style>
	:root {
		--bg: #f6f7fb;
		--card: #ffffff;
		--text: #1d2330;
		--muted: #6b7385;
		--line: rgba(29, 35, 48, .08);
		--accent: #6d5dfc;
		--accent-2: #22b8cf;
		--glow: rgba(109, 93, 252, .18);
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #0d1117;
			--card: #161b22;
			--text: #e6edf3;
			--muted: #8b949e;
			--line: rgba(240, 246, 252, .08);
			--accent: #a371f7;
			--accent-2: #39c5cf;
			--glow: rgba(163, 113, 247, .22);
		}
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; }
	body {
		margin: 0;
		display: grid;
		place-items: center;
		padding: 24px 16px;
		background:
			radial-gradient(900px 500px at 15% -10%, var(--glow), transparent 60%),
			radial-gradient(700px 400px at 110% 110%, rgba(57, 197, 207, .12), transparent 60%),
			var(--bg);
		color: var(--text);
		font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
		-webkit-font-smoothing: antialiased;
	}
	.card {
		width: min(440px, 100%);
		padding: 44px 36px 36px;
		border: 1px solid var(--line);
		border-radius: 20px;
		background: var(--card);
		box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 24px 60px -24px rgba(0, 0, 0, .25);
		text-align: center;
		animation: rise .6s cubic-bezier(.2, .8, .2, 1) both;
	}
	/* A ring that turns, with a soft glow and a dot that orbits it */
	.spinner { position: relative; width: 76px; height: 76px; margin: 0 auto 28px; }
	.spinner::before {
		content: "";
		position: absolute;
		inset: 0;
		border-radius: 50%;
		background: conic-gradient(from 0deg, transparent 0deg, var(--accent-2) 120deg, var(--accent) 260deg, transparent 360deg);
		-webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
		mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
		animation: spin 1.1s linear infinite;
	}
	.spinner::after {
		content: "";
		position: absolute;
		inset: 14px;
		border-radius: 50%;
		background: radial-gradient(circle, var(--glow), transparent 70%);
		animation: breathe 2.2s ease-in-out infinite;
	}
	.spinner span {
		position: absolute;
		top: 50%;
		left: 50%;
		width: 10px;
		height: 10px;
		margin: -5px 0 0 -5px;
		border-radius: 50%;
		background: var(--accent);
		box-shadow: 0 0 12px var(--accent);
		animation: orbit 1.1s linear infinite;
	}
	h1 { margin: 0 0 8px; font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
	p { margin: 0; color: var(--muted); }
	.status {
		display: inline-flex;
		align-items: center;
		gap: 8px;
		margin-top: 26px;
		padding: 7px 14px;
		border: 1px solid var(--line);
		border-radius: 999px;
		color: var(--muted);
		font-size: 13px;
	}
	.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-2); animation: pulse 1.6s ease-in-out infinite; }
	.host { margin-top: 18px; font-size: 12px; color: var(--muted); opacity: .7; }
	@keyframes spin { to { transform: rotate(360deg); } }
	@keyframes orbit { from { transform: rotate(0deg) translateX(33px); } to { transform: rotate(360deg) translateX(33px); } }
	@keyframes breathe { 0%, 100% { opacity: .5; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.05); } }
	@keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
	@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
	@media (prefers-reduced-motion: reduce) {
		.spinner::before, .spinner::after, .spinner span, .status i, .card { animation-duration: 0s; animation-iteration-count: 1; }
	}
</style>
</head>
<body>
	<main class="card" role="status" aria-live="polite">
		<div class="spinner" aria-hidden="true"><span></span></div>
		<h1>Vi opdaterer siden</h1>
		<p>Det tager kun et øjeblik. Siden kommer tilbage af sig selv, så du behøver ikke gøre noget.</p>
		<div class="status"><i></i><span id="status">Opdaterer…</span></div>
		<div class="host" id="host"></div>
	</main>
	<script>
		// The site's own name, and a check every few seconds that reloads the page as soon as the site answers again
		document.getElementById("host").textContent = location.hostname;
		const status = document.getElementById("status");
		let seconds = 0;
		setInterval(() => { seconds += 1; status.textContent = seconds < 60 ? `Opdaterer… ${seconds} s` : "Næsten færdig…"; }, 1000);
		setInterval(async () => {
			try {
				const response = await fetch(location.href, { cache: "no-store", method: "HEAD" });
				if (response.status !== 503) {
					status.textContent = "Klar, genindlæser…";
					location.reload();
				}
			} catch (error) {}
		}, 5000);
	</script>
</body>
</html>
