<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · VNS Harbor</title>
<link rel="icon" href="/static/harbor-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
</head>
<body class="login">
<main class="login-shell">
  <form method="post" action="/login" class="card login-card">
  <header class="login-heading">
    <div class="login-brand">
      <img class="login-logo" src="/static/harbor-mark.svg" width="56" height="56" alt="">
      <div class="login-brand-name">VNS Harbor<span>Server admin</span></div>
    </div>
    <h1>Your server. Under control.</h1>
    <p>Sites, services and databases. One workspace.</p>
  </header>
  <div class="card-body">
    <h2>Welcome back</h2>
    <p class="login-intro">Sign in to manage your server.</p>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Username <input name="username" autocomplete="username" autofocus required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    {% if error %}<p class="error login-error" role="alert">{{ error }}</p>{% endif %}
    <button type="submit" class="primary wide">Log in</button>
  </div>
  </form>
  <footer class="login-footer">
    <a class="powered-by" href="https://vns.dk" target="_blank" rel="noopener">
      <img src="/static/vns-logo-footer.png" width="54" height="38" alt="VNS - vital new software">
      <span>Powered by VNS</span>
    </a>
  </footer>
</main>
</body>
</html>
