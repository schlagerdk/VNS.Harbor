      <stop offset="1" stop-color="#8a4fc4"/>
    </linearGradient>
    <linearGradient id="harbor-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6c9" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff6c9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="harbor-beam-left" x1="1" y1="0" x2="0" y2="0">
